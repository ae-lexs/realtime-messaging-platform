syntax = "proto3";

package events.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aelexs/realtime-messaging-platform/gen/events/v1;eventsv1";

// Kafka event wire format (ADR-022 D1).
//
// These are the analytical/streaming contracts, versioned independently of the
// gRPC service contracts in messaging/v1: once a topic produces bytes and the
// BigQuery sink consumes them, the envelope is a published contract. Evolution
// is FULL-compatible (ADR-011 §5.1), enforced by `buf breaking` in CI.
//
// Message order in this file is load-bearing: the Confluent wire format
// identifies the message inside a schema by its declaration index, so
// reordering or inserting a top-level message is a breaking change for every
// already-encoded record. Append new event types at the end.
//
// Topic → subject mapping (TopicNameStrategy):
//   messages.persisted   → messages.persisted-value   (index 1)
//   memberships.changed  → memberships.changed-value  (index 2)
//   chats.created        → chats.created-value        (index 3)

// EnvelopeMeta is a faithful Protobuf translation of ADR-011 §3.3's JSON
// envelope. Every ADR-011 field is preserved except `partition_key`, which is
// intentionally dropped: it was always chat_id, and each event carries chat_id.
message EnvelopeMeta {
  // ULID (ADR-011) — sortable, and the UPSERT key at the BigQuery sink
  // (ADR-022 D2). It is what makes the at-least-once relay effectively-once.
  string event_id = 1;

  // Discriminator, e.g. "MessagePersisted". Redundant with the Protobuf type
  // but kept for dead-letter triage and ADR-011 parity.
  string event_type = 2;

  // Semver of proto/events/v1, e.g. "1.0.0". Replaces ADR-011 event_version.
  string schema_version = 3;

  // When the event occurred (not when it was published). Partitions the
  // BigQuery landing tables by DATE(occurred_at).
  google.protobuf.Timestamp occurred_at = 4;

  // Producing service INSTANCE identity (ADR-011 fidelity), e.g. "ingest-7d9f".
  string producer_id = 5;

  // Distributed-tracing correlation ID (ADR-012), preserved from ADR-011.
  string trace_id = 6;
}

// MessagePersisted is published to `messages.persisted` by the Ingest outbox
// relay, once per committed message (ADR-022 D4). METADATA ONLY: the message
// body is deliberately absent so it cannot reach the lake through connector
// misconfiguration (ADR-022 D3, honouring ADR-013's content scope).
message MessagePersisted {
  EnvelopeMeta meta = 1;

  // Also the Kafka partition key (ADR-011 bucketing) and the BigQuery
  // clustering key (ADR-022 D2).
  string chat_id = 2;

  // Per-chat monotonic sequence assigned in the write transaction (ADR-004
  // Option 5, ADR-023). Gaps are tolerated; duplicates are not.
  uint64 sequence = 3;

  string sender_id = 4;

  // Size of the body in bytes — NOT the body.
  uint32 content_bytes = 5;

  // MIME type, e.g. "text/plain" (ADR-013 restricts this to text).
  string content_type = 6;
}

// MembershipChanged is published to `memberships.changed` by Chat Management
// after the Firestore write commits. At-least-once (Firestore has no
// cross-collection transactional outbox), deduped downstream by event_id.
message MembershipChanged {
  // CHANGE_UNSPECIFIED = 0 so an omitted field is never silently "added".
  enum Change {
    CHANGE_UNSPECIFIED = 0;
    CHANGE_ADDED = 1;
    CHANGE_REMOVED = 2;
    CHANGE_ROLE_CHANGED = 3;
  }

  EnvelopeMeta meta = 1;
  string chat_id = 2;
  string user_id = 3;
  Change change = 4;
}

// ChatCreated is published to `chats.created` by Chat Management after the
// Firestore write commits. At-least-once, as above.
message ChatCreated {
  EnvelopeMeta meta = 1;
  string chat_id = 2;
  string creator_id = 3;
}
