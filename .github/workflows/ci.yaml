# CI Pipeline - Runs on all pull requests
# Per ADR-014 §8.2, all stages must pass before merge.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Substrate gate — no AWS SDK imports may remain (M0.1, ADR-021).
  no-aws:
    name: No AWS SDK Imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assert no aws-sdk-go imports
        run: |
          if grep -rn "aws-sdk-go" --include="*.go" . ; then
            echo "AWS SDK imports found — M0.1 requires none"
            exit 1
          fi
          echo "No AWS SDK imports found."

  # Proto validation
  proto:
    name: Proto Lint & Breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Needed for buf breaking against main

      - name: Fetch main branch
        if: github.event_name == 'pull_request'
        run: git fetch origin main:refs/heads/main

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buf lint
        run: cd proto && buf lint

      - name: Buf breaking
        if: github.event_name == 'pull_request'
        run: cd proto && buf breaking --against '../.git#branch=main,subdir=proto'

  # Go linting
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest

      - name: Generate proto stubs
        run: cd proto && buf generate

      # Build golangci-lint v2 from source to support Go 1.26
      # Pre-built binaries may be built with older Go versions
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

  # Unit tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest

      - name: Generate proto stubs
        run: cd proto && buf generate

      - name: Run tests
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.txt
          fail_ci_if_error: false

  # Build verification
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest

      - name: Generate proto stubs
        run: cd proto && buf generate

      - name: Build all services
        run: go build -v ./cmd/...

  # Docker build verification
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, ingest, fanout, chatmgmt]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest

      - name: Generate proto stubs
        run: cd proto && buf generate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          push: false
          tags: messaging-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Terraform validation
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Terraform file changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            terraform:
              - 'terraform/**'

      - name: Setup Terraform
        if: steps.changes.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.8'

      - name: Terraform fmt check
        if: steps.changes.outputs.terraform == 'true'
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Setup tflint
        if: steps.changes.outputs.terraform == 'true'
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: 'v0.63.1'

      - name: Init tflint plugins
        if: steps.changes.outputs.terraform == 'true'
        run: tflint --init --config terraform/.tflint.hcl
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run tflint
        if: steps.changes.outputs.terraform == 'true'
        run: tflint --recursive --config "$(pwd)/.tflint.hcl"
        working-directory: terraform

      - name: Run trivy security scan
        if: steps.changes.outputs.terraform == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Validate dev environment
        if: steps.changes.outputs.terraform == 'true'
        run: |
          terraform -chdir=terraform/environments/dev init -backend=false
          terraform -chdir=terraform/environments/dev validate

  # Final gate - all checks must pass
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [no-aws, proto, lint, test, build, docker, terraform]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.no-aws.result }}" != "success" ]] || \
             [[ "${{ needs.proto.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.docker.result }}" != "success" ]] || \
             [[ "${{ needs.terraform.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed!"
