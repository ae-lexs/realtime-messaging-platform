apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  annotations:
    # External GCE Ingress provisions a Google Cloud external Application Load
    # Balancer. The Gateway is the only externally-reachable service in M0.2;
    # the raised backend timeout rides on its Service via the BackendConfig.
    kubernetes.io/ingress.class: "gce"
spec:
  defaultBackend:
    service:
      name: gateway
      port:
        number: 80
