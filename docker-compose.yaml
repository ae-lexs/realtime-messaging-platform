# Development workspace — GCP-targeting (ADR-021 Axis F).
#
# There is no local cloud emulation of any kind — no fake cloud APIs, no local
# broker, no local Redis (ADR-021 Axis F). Dev targets a real GCP project via
# Terraform (M0.2+); unit tests are hermetic and run in the toolbox.
#
#   make dev            # start the four health-only services with hot reload
#   make toolbox CMD=.. # run any command in the toolbox
#
services:
  # Toolbox — runs every make target (lint, test, proto, build) and the GCP
  # deploy-and-destroy loop. Carries gcloud, terraform, kubectl, buf, and Go.
  toolbox:
    build:
      context: .
      dockerfile: docker/toolbox.Dockerfile
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache-toolbox:/root/.cache/go-build
      # gcloud/ADC + kubeconfig live on the host and are mounted :rw, not :ro —
      # the SDK rewrites these files when it refreshes a token, so a read-only
      # mount works until the first expiry and then fails. Run `make gcp-auth`
      # once to populate them.
      - ${HOME}/.config/gcloud:/root/.config/gcloud:rw
      - ${HOME}/.kube:/root/.kube:rw
    working_dir: /app
    command: ["sleep", "infinity"]
    environment:
      - GOPROXY=https://proxy.golang.org,direct
      - GOPRIVATE=github.com/aelexs/*
      - USE_GKE_GCLOUD_AUTH_PLUGIN=True
      - CLOUDSDK_CONFIG=/root/.config/gcloud

  # Gateway Service — health-only skeleton (M0.1).
  gateway:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    ports:
      - "8080:8080"   # HTTP health check
      - "9090:9090"   # gRPC
      - "2345:2345"   # Delve debugger
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /app
    command: ["air", "-c", ".air/gateway.toml"]
    env_file:
      - .env.dev
    environment:
      - ENVIRONMENT=local
      - GATEWAY_HTTP_PORT=8080
      - GATEWAY_GRPC_PORT=9090

  # Ingest Service — health-only skeleton (M0.1).
  ingest:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    ports:
      - "8081:8081"   # HTTP health check
      - "9091:9091"   # gRPC
      - "2346:2345"   # Delve debugger
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /app
    command: ["air", "-c", ".air/ingest.toml"]
    env_file:
      - .env.dev
    environment:
      - ENVIRONMENT=local
      - INGEST_HTTP_PORT=8081
      - INGEST_GRPC_PORT=9091

  # Fanout Service — health-only skeleton (M0.1).
  fanout:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    ports:
      - "8082:8082"   # HTTP health check
      - "2347:2345"   # Delve debugger
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /app
    command: ["air", "-c", ".air/fanout.toml"]
    env_file:
      - .env.dev
    environment:
      - ENVIRONMENT=local
      - FANOUT_HTTP_PORT=8082

  # Chat Management Service — health-only skeleton (M0.1); the auth composition
  # root returns with the Firestore re-home in M1.2.
  chatmgmt:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    ports:
      - "8083:8083"   # HTTP health check
      - "2348:2345"   # Delve debugger
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /app
    command: ["air", "-c", ".air/chatmgmt.toml"]
    env_file:
      - .env.dev
    environment:
      - ENVIRONMENT=local
      - CHATMGMT_HTTP_PORT=8083

volumes:
  go-mod-cache:
  go-build-cache:
  go-build-cache-toolbox:

networks:
  default:
    name: messaging-network
