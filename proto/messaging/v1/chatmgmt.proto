syntax = "proto3";

package messaging.v1;

import "google/api/annotations.proto";
import "messaging/v1/common.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/aelexs/realtime-messaging-platform/gen/messaging/v1;messagingv1";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Realtime Messaging Platform API";
    version: "1.0.0";
    description: "REST API for the Realtime Messaging Platform. Covers authentication (OTP login, token lifecycle, sessions) and chat management (chat CRUD, membership, message history).";
  };
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "Bearer";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "JWT access token. Format: Bearer <token>";
      };
    };
  };
};

// AuthService handles authentication operations on the Chat Mgmt service.
// OTP-based passwordless login, token lifecycle, and session management.
// Exposes both gRPC and REST (via grpc-gateway) endpoints (ADR-015).
service AuthService {
  // RequestOTP sends a one-time password to the given phone number.
  rpc RequestOTP(RequestOTPRequest) returns (RequestOTPResponse) {
    option (google.api.http) = {
      post: "/v1/auth/otp/request"
      body: "*"
    };
  }

  // VerifyOTP verifies an OTP and returns authentication tokens.
  // Creates a new user if the phone number is not registered.
  rpc VerifyOTP(VerifyOTPRequest) returns (VerifyOTPResponse) {
    option (google.api.http) = {
      post: "/v1/auth/otp/verify"
      body: "*"
    };
  }

  // RefreshTokens exchanges a refresh token for new access and refresh tokens.
  // Requires the (potentially expired) access token in the Authorization header.
  rpc RefreshTokens(RefreshTokensRequest) returns (RefreshTokensResponse) {
    option (google.api.http) = {
      post: "/v1/auth/tokens/refresh"
      body: "*"
    };
  }

  // Logout revokes the current session.
  // Requires a valid access token in the Authorization header.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }
}

// ChatMgmtService handles chat lifecycle and membership operations.
// Exposes both gRPC and REST (via grpc-gateway) endpoints.
service ChatMgmtService {
  // CreateChat creates a new chat (direct or group).
  // For direct chats, returns existing chat if one already exists for the pair.
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse) {
    option (google.api.http) = {
      post: "/v1/chats"
      body: "*"
    };
  }

  // GetChat retrieves chat details by ID.
  rpc GetChat(GetChatRequest) returns (GetChatResponse) {
    option (google.api.http) = {
      get: "/v1/chats/{chat_id}"
    };
  }

  // UpdateChat updates a group chat's metadata (ADR-006 §4.4).
  // Owner and admin only; direct chats cannot be renamed.
  rpc UpdateChat(UpdateChatRequest) returns (UpdateChatResponse) {
    option (google.api.http) = {
      patch: "/v1/chats/{chat_id}"
      body: "*"
    };
  }

  // ListChats lists chats the user is a member of.
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse) {
    option (google.api.http) = {
      get: "/v1/chats"
    };
  }

  // AddMember adds a user to a group chat.
  // Direct chats do not allow membership changes.
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse) {
    option (google.api.http) = {
      post: "/v1/chats/{chat_id}/members"
      body: "*"
    };
  }

  // RemoveMember removes a user from a group chat (ADR-006 §4.6).
  // Owner can remove anyone but themselves; admin can remove members only.
  // To remove yourself, call LeaveChat.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (google.api.http) = {
      delete: "/v1/chats/{chat_id}/members/{user_id}"
    };
  }

  // UpdateMemberRole changes a member's role in a group chat (ADR-006 §4.7).
  // Owner only. The owner role cannot be assigned or revoked, because
  // ownership transfer is out of scope for the MVP (ADR-016 §4.4).
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse) {
    option (google.api.http) = {
      patch: "/v1/chats/{chat_id}/members/{user_id}"
      body: "*"
    };
  }

  // LeaveChat removes the calling user from a group chat (ADR-006 §4.8).
  // The owner cannot leave, because ownership transfer does not exist yet;
  // a direct chat cannot be left at all — mute it instead.
  rpc LeaveChat(LeaveChatRequest) returns (LeaveChatResponse) {
    option (google.api.http) = {
      post: "/v1/chats/{chat_id}/leave"
      body: "*"
    };
  }

  // MuteChat silences notifications for the calling user (ADR-006 §4.9).
  // A per-user setting rather than a mutation of the chat, so unlike every
  // other membership operation it is allowed on direct chats.
  rpc MuteChat(MuteChatRequest) returns (MuteChatResponse) {
    option (google.api.http) = {
      post: "/v1/chats/{chat_id}/mute"
      body: "*"
    };
  }

  // UnmuteChat clears the mute (ADR-006 §4.10).
  rpc UnmuteChat(UnmuteChatRequest) returns (UnmuteChatResponse) {
    option (google.api.http) = {
      post: "/v1/chats/{chat_id}/unmute"
      body: "*"
    };
  }

  // GetMessages retrieves message history for a chat.
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse) {
    option (google.api.http) = {
      get: "/v1/chats/{chat_id}/messages"
    };
  }
}

// CreateChatRequest contains parameters for creating a chat.
message CreateChatRequest {
  // Type of chat to create.
  ChatType chat_type = 1;

  // Display name for group chats. Required for groups, 1-128 characters.
  // Ignored for direct chats, which cannot be named (ADR-006 §4.1).
  string name = 2;

  // Members to add, EXCLUDING the caller, who is added automatically
  // (ADR-006 §4.1). Exactly one ID for a direct chat; 1-99 for a group,
  // which with the caller makes the 100-member maximum.
  repeated string member_ids = 3;
}

// CreateChatResponse contains the created or existing chat.
message CreateChatResponse {
  // The chat.
  Chat chat = 1;

  // True when a direct chat for this pair already existed and is being
  // returned rather than created (ADR-006 §4.1). REST maps this to
  // 200 OK + `X-Idempotent-Replay: true` instead of 201 Created; it is not
  // an error, and a caller may create a direct chat without checking first.
  bool is_existing = 2;

  // Members of the chat, the creator included.
  repeated ChatMember members = 3;
}

// GetChatRequest identifies the chat to retrieve.
message GetChatRequest {
  string chat_id = 1;
}

// GetChatResponse contains the requested chat.
message GetChatResponse {
  Chat chat = 1;

  // All members of the chat (ADR-006 §4.3).
  repeated ChatMember members = 2;

  // The caller's own membership, carrying their role and mute state.
  ChatMember my_membership = 3;
}

// UpdateChatRequest changes a group chat's metadata.
message UpdateChatRequest {
  string chat_id = 1;

  // New chat name, 1-128 characters.
  string name = 2;
}

// UpdateChatResponse contains the updated chat.
message UpdateChatResponse {
  Chat chat = 1;
}

// ListChatsRequest contains pagination parameters.
message ListChatsRequest {
  // Pagination.
  PageRequest page = 1;

  // When set, return only chats updated at or after this time
  // (ADR-006 §4.2's `updated_since`).
  optional Timestamp updated_since = 2;
}

// ListChatsResponse contains the user's chats.
message ListChatsResponse {
  // Chats the user is a member of.
  repeated Chat chats = 1;

  // Pagination metadata.
  PageResponse page = 2;
}

// AddMemberRequest specifies the member to add.
message AddMemberRequest {
  string chat_id = 1;
  string user_id = 2;

  // Role to grant. Defaults to MEMBER when unspecified. An owner may grant
  // ADMIN; an admin may only add members (ADR-006 §4.5).
  MemberRole role = 3;
}

// AddMemberResponse confirms the member was added (ADR-006 §4.5).
message AddMemberResponse {
  reserved 1;
  reserved "member_count";

  // The membership that was created.
  ChatMember member = 2;

  // User who performed the addition.
  string added_by = 3;
}

// RemoveMemberRequest specifies the member to remove.
message RemoveMemberRequest {
  string chat_id = 1;
  string user_id = 2;
}

// RemoveMemberResponse confirms the member was removed.
//
// Deliberately empty: ADR-006 §4.6 answers 204 No Content, and a member
// count in the body would be a second source of truth for a number the
// caller can read from the chat.
message RemoveMemberResponse {
  reserved 1;
  reserved "member_count";
}

// UpdateMemberRoleRequest changes a member's role.
message UpdateMemberRoleRequest {
  string chat_id = 1;
  string user_id = 2;

  // New role: MEMBER or ADMIN. OWNER cannot be assigned (ADR-006 §4.7).
  MemberRole role = 3;
}

// UpdateMemberRoleResponse contains the updated membership.
message UpdateMemberRoleResponse {
  ChatMember member = 1;

  // User who performed the change.
  string updated_by = 2;
}

// LeaveChatRequest identifies the chat to leave.
message LeaveChatRequest {
  string chat_id = 1;
}

// LeaveChatResponse confirms the user left.
message LeaveChatResponse {}

// MuteChatRequest silences a chat for the caller.
message MuteChatRequest {
  string chat_id = 1;

  // Hours to stay muted, at most 8760 (one year). Absent means indefinite
  // (ADR-006 §4.9).
  optional int32 duration_hours = 2;
}

// MuteChatResponse reports the resulting mute.
message MuteChatResponse {
  string chat_id = 1;

  // When the mute lapses. Absent when muted indefinitely.
  optional Timestamp muted_until = 2;
}

// UnmuteChatRequest clears a mute.
message UnmuteChatRequest {
  string chat_id = 1;
}

// UnmuteChatResponse confirms the chat is unmuted.
message UnmuteChatResponse {
  string chat_id = 1;
}

// GetMessagesRequest specifies message history query parameters.
message GetMessagesRequest {
  string chat_id = 1;

  // Return messages with sequence > after_sequence.
  // Used for sync-on-reconnect.
  optional uint64 after_sequence = 2;

  // Return messages with sequence < before_sequence.
  // Used for backward pagination.
  optional uint64 before_sequence = 3;

  // Pagination.
  PageRequest page = 4;
}

// GetMessagesResponse contains message history.
message GetMessagesResponse {
  // Messages in ascending sequence order.
  repeated Message messages = 1;

  // Pagination metadata.
  PageResponse page = 2;
}

// Chat represents a chat room.
message Chat {
  string chat_id = 1;
  ChatType chat_type = 2;

  // Empty for direct chats, which cannot be named.
  string name = 3;

  // Number of members. Display and the group-size cap only — never an
  // authorization input, which reads memberships directly (ADR-016 §3.2).
  int32 member_count = 4;

  // When the chat was created.
  Timestamp created_at = 5;

  // Last message sequence, for sync. Served from the Postgres write path,
  // so it is populated from M2.2 onward and left zero before that.
  uint64 last_sequence = 6;

  // User who created the chat. Owner of a group; for a direct chat it
  // records who opened it, and confers nothing — direct chats have no owner.
  string created_by = 7;

  // When the chat metadata last changed.
  Timestamp updated_at = 8;
}

// ChatMember represents a chat membership.
message ChatMember {
  string user_id = 1;
  string chat_id = 2;

  // Role in the chat.
  MemberRole role = 3;

  // When the user joined.
  Timestamp joined_at = 4;

  // Denormalized for display, so rendering a member list costs no extra
  // user lookups (ADR-006 §4.3).
  string display_name = 5;

  // When this member's mute lapses. Absent when not muted. Per-user state
  // that happens to live on the membership document (ADR-023).
  optional Timestamp muted_until = 6;
}

// MemberRole defines user roles in a chat.
//
// Three roles, matching ADR-006 §8's authorization matrix. Direct chats use
// MEMBER for both participants and have no owner (ADR-006 §4.1).
enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_MEMBER = 1;
  MEMBER_ROLE_OWNER = 2;
  MEMBER_ROLE_ADMIN = 3;
}

// The Kafka event types that lived here — ChatCreatedEvent,
// MembershipChangedEvent and MembershipChangeType — were removed in M1.3.
//
// They were ADR-011's JSON-era shapes, superseded by ADR-022 D1's Protobuf
// events in proto/events/v1, which are the ones actually registered with the
// schema registry (M0.3) and produced from M2.3. Nothing generated or consumed
// the duplicates; keeping two definitions of one event on the wire is how the
// two drift apart. events/v1/membership_changed.proto is the live contract,
// and its Change enum carries the CHANGE_ROLE_CHANGED case this pair never
// had.

// ============================================================================
// Auth messages (ADR-015)
// ============================================================================

// RequestOTPRequest contains the phone number to send an OTP to.
message RequestOTPRequest {
  // Phone number in E.164 format (e.g., "+14155552671").
  string phone_number = 1;
}

// RequestOTPResponse confirms the OTP was sent.
message RequestOTPResponse {
  // When the OTP expires.
  Timestamp expires_at = 1;

  // Seconds before the client may request a new OTP.
  int32 retry_after_seconds = 2;
}

// VerifyOTPRequest contains the OTP and device information.
message VerifyOTPRequest {
  // Phone number in E.164 format.
  string phone_number = 1;

  // The 6-digit OTP code.
  string otp = 2;

  // Client-generated device identifier (UUIDv4).
  string device_id = 3;
}

// VerifyOTPResponse contains the authenticated user and tokens.
message VerifyOTPResponse {
  // The authenticated user.
  AuthUser user = 1;

  // Session identifier.
  string session_id = 2;

  // JWT access token.
  string access_token = 3;

  // Opaque refresh token.
  string refresh_token = 4;

  // True if this is a newly registered user.
  bool is_new_user = 5;

  // When the access token expires.
  Timestamp access_token_expires_at = 6;
}

// RefreshTokensRequest contains the refresh token to exchange.
message RefreshTokensRequest {
  // The current refresh token.
  string refresh_token = 1;
}

// RefreshTokensResponse contains the new tokens.
message RefreshTokensResponse {
  // New JWT access token.
  string access_token = 1;

  // New opaque refresh token.
  string refresh_token = 2;

  // When the new access token expires.
  Timestamp access_token_expires_at = 3;
}

// LogoutRequest contains the refresh token to revoke.
message LogoutRequest {
  // The current refresh token (ensures client holds both tokens).
  string refresh_token = 1;
}

// LogoutResponse is empty on success.
message LogoutResponse {}

// AuthUser represents an authenticated user returned by auth endpoints.
message AuthUser {
  // Unique user identifier.
  string user_id = 1;

  // Phone number in E.164 format.
  string phone_number = 2;

  // User display name (empty for new users).
  string display_name = 3;

  // Whether the phone number is verified.
  bool phone_verified = 4;

  // When the user was created.
  Timestamp created_at = 5;
}
