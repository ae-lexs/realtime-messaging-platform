apiVersion: apps/v1
kind: Deployment
metadata:
  name: fanout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fanout
  template:
    metadata:
      labels:
        app: fanout
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fanout
          image: messaging-fanout
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: ENVIRONMENT
              value: dev
            - name: FANOUT_HTTP_PORT
              value: "8082"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fanout
spec:
  type: ClusterIP
  selector:
    app: fanout
  ports:
    - name: http
      port: 80
      targetPort: http
